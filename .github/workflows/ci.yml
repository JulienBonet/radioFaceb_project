
name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client:
    name: Frontend - Lint et build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client

    steps:
      - name: Récupération du code
        uses: actions/checkout@v7

      - name: Configuration de Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Installation des dépendances
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Build
        run: npm run build

  server:
    name: Backend - Lint, format et chargement
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    steps:
      - name: Récupération du code
        uses: actions/checkout@v7

      - name: Configuration de Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Installation des dépendances
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier
        run: npm run format:check

      - name: Chargement de l'application
        run: node -e "import('./app.js').then(() => console.log('API chargée'))"
